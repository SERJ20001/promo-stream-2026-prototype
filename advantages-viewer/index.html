<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Прототип с преимуществами на одном экране">
  <title>Промо-стрим 2026 — все преимущества</title>
  <link rel="icon" type="image/png" href="assets/icon-eye.png">
  <style>[hidden]{display:none!important}html,body{margin:0}#assetGate{position:fixed;inset:0;z-index:100;background:white;display:grid;place-items:center}</style>
  <link rel="stylesheet" href="style.css?v=89">
  <link rel="stylesheet" href="alternative.css?v=93">
  <link rel="stylesheet" href="viewer.css?v=89">
  <link rel="preload" as="image" href="assets/product-boots.png">
</head>
<body>
  <div class="assetGate" id="assetGate">
    <div class="assetGateContent">
      <div role="status" aria-live="polite">
        <strong class="assetGateTitle">Загружаем прототип</strong>
        <div class="assetGateTrack"><span class="assetGateProgress" id="assetGateProgress"></span></div>
        <span class="assetGateStatus" id="assetGateStatus">Подготавливаем ресурсы · 0%</span>
      </div>
      <button id="assetGateRetry" class="viewerRetry" hidden>Повторить загрузку</button>
    </div>
  </div>
  <section class="viewerChoice" id="viewerChoice" aria-labelledby="viewerChoiceTitle" hidden inert>
    <div class="viewerChoiceContent">
      <h1 id="viewerChoiceTitle" tabindex="-1">Как посмотреть<br>прототип?</h1>
      <div class="viewerChoices">
        <button class="viewerOption" data-viewer="phone"><strong>На телефоне</strong><span>Открыть на весь экран</span></button>
        <button class="viewerOption" data-viewer="desktop"><strong>На компьютере</strong><span>Показать в рамке смартфона</span></button>
      </div>
    </div>
  </section>
  <div class="stage viewerStage" id="viewerStage" hidden inert>
    <div class="viewerDevice">
      <div class="viewerDisplay">
        <div class="viewerStatus" aria-hidden="true"><img src="assets/status-bar.png" width="375" height="44" alt=""></div>
        <main class="phone" id="app" aria-busy="true" inert>
          <div id="screen" class="recommendationsScreen">
            <header class="header" id="header">
              <nav class="nav">
                <button class="back" aria-label="Назад" data-action="back"><img src="assets/icon-back.png" alt=""></button>
                <button class="save" data-action="save-exit">Сохранить и выйти</button>
              </nav>
              <div class="compactWrap" aria-hidden="true"><div class="compactProduct" data-product-preview="compact"></div></div>
            </header>
            <div class="scroll" id="scroll">
              <section class="recommendationIntro">
                <div class="recommendationProduct" data-product-preview="full"></div>
                <div class="recommendationHeading">
                  <h1>Привлеките покупателей</h1>
                  <p>Преимущества помогут выделить ваш товар<br>среди других и продать быстрее</p>
                </div>
              </section>
              <section class="recommendationSection" aria-labelledby="promotionTitle">
                <h2 id="promotionTitle">Специальные услуги</h2>
                <div class="recommendationCarousel" tabindex="0" aria-label="Карточки специальных услуг" data-card-group="promotion"></div>
              </section>
              <section class="recommendationSection" aria-labelledby="discountsTitle">
                <h2 id="discountsTitle">Скидки и акции</h2>
                <div class="recommendationCarousel" id="carousel" tabindex="0" aria-label="Карточки скидок и акций" data-card-group="discounts"></div>
              </section>
              <section class="recommendationSection" aria-labelledby="contentTitle">
                <h2 id="contentTitle">Контент и условия</h2>
                <div class="recommendationCarousel" tabindex="0" aria-label="Карточки контента и условий" data-card-group="content"></div>
              </section>
            </div>
            <footer class="footer recommendationFooter withoutPaidServices">
              <button class="recommendationTotals" data-sheet="total" aria-label="Показать детализацию итогов">
                <span class="totalRows">
                  <span class="totalRow" data-services-row hidden><span data-services-label>Платные услуги</span><span class="dots"></span><strong data-payment>0 ₽</strong></span>
                  <span class="totalRow"><span data-payout-label>Вы получите за товар</span><span class="dots"></span><strong data-payout aria-live="polite">4 850 ₽</strong></span>
                </span>
                <span class="totalDetails"><img src="assets/icon-chevron.png" alt=""></span>
              </button>
              <button class="primary continueButton" data-action="complete">Готово</button>
            </footer>
          </div>
          <div class="overlay" id="overlay" hidden>
            <div class="scrim" data-action="close"></div>
            <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" tabindex="-1">
              <div class="handle"></div>
              <button class="close" aria-label="Закрыть" data-action="close"><img src="assets/sheets/close.svg" alt=""></button>
              <div id="sheetContent"></div>
            </section>
          </div>
          <div class="toast" id="toast" role="status"></div>
        </main>
        <div class="viewerHome" aria-hidden="true"><i></i></div>
      </div>
    </div>
  </div>
  <script src="preload.js?v=93"></script>
</body>
</html>
